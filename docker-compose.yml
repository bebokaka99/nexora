# NEXORA — docker-compose cho môi trường DEV LOCAL
#
# Chạy toàn bộ hệ thống bằng một lệnh (cần Docker + file .env theo mẫu):
#   cp .env.example .env
#   docker compose up --build
#
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:4000/api/v1  (Swagger: http://localhost:4000/docs)
#   Postgres: localhost:5432 — Redis: localhost:6379
#
# ⚠️ Các giá trị mặc định bên dưới CHỈ DÙNG CHO DEV. Không dùng cho production:
# đổi POSTGRES_PASSWORD qua file .env. JWT_SECRET / JWT_REFRESH_SECRET là
# BẮT BUỘC — compose sẽ lỗi nếu thiếu trong .env (không còn default yếu).
# Dừng và xóa dữ liệu dev: docker compose down -v

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Context là gốc repo: Dockerfile cần database/prisma/ (schema+migrations).
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora_dev_only}@postgres:5432/${POSTGRES_DB:-nexora}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET chưa đặt trong .env}
      PORT: 4000
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:3000
      SWAGGER_PATH: docs
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
